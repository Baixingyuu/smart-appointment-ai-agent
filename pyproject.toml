[project]
name = "helpdesk-agentscope"
version = "0.1.0"
description = "AgentScope-native rebuild of the Go helpdesk-agent"
requires-python = ">=3.11"
dependencies = [
    "agentscope[ollama,rag,milvuslite,sql,service]>=2.0.8,<2.1",
    "aiosqlite>=0.22.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
