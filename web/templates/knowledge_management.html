<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - 智能工单助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: white; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.85); margin-bottom: 24px; }
        .nav { margin-bottom: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; background: rgba(255,255,255,0.2);
                 border-radius: 20px; font-size: 14px; transition: all 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.35); }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .doc { border: 1px solid #f0f0f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .doc .cat { display: inline-block; background: #e3f2fd; color: #1976d2; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .doc .content { font-size: 14px; color: #333; line-height: 1.6; }
        .doc .del { float: right; color: #e74c3c; cursor: pointer; font-size: 13px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 60px; resize: vertical; }
        button { padding: 10px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none;
                 border-radius: 8px; font-size: 14px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .kw { color: #999; font-size: 12px; margin-top: 6px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 知识库管理</h1>
    <div class="subtitle">产品技术支持知识库（RAG 检索源）</div>
    <div class="nav">
        <a href="/">← 返回聊天</a>
        <a href="/tickets">工单列表</a>
        <a href="/engineers">工程师列表</a>
        <a href="/customers">客户健康度</a>
    </div>

    <div class="card">
        <h3 style="margin-bottom:14px;color:#667eea">➕ 添加知识条目</h3>
        <form id="add-form">
            <input type="text" id="kw-category" placeholder="分类（如：服务等级 / 常见问题）" required>
            <textarea id="kw-content" placeholder="知识内容" required></textarea>
            <input type="text" id="kw-keywords" placeholder="关键词（逗号分隔，可选）">
            <button type="submit">添加</button>
        </form>
    </div>

    <div class="card">
        <h3 style="margin-bottom:14px;color:#667eea">📖 现有知识条目（<span id="count">0</span>）</h3>
        <div id="doc-list"><p style="color:#999">加载中...</p></div>
    </div>
</div>
<script>
async function loadKnowledge() {
    const res = await fetch('/api/knowledge');
    const data = await res.json();
    const docs = data.documents || [];
    document.getElementById('count').textContent = docs.length;
    const list = document.getElementById('doc-list');
    if (!docs.length) {
        list.innerHTML = '<p style="color:#999">暂无知识条目</p>';
        return;
    }
    list.innerHTML = docs.map(d => `
        <div class="doc">
            <span class="del" onclick="delDoc(${d.id})">删除</span>
            <span class="cat">${d.category}</span>
            <div class="content">${d.content}</div>
            ${d.keywords && d.keywords.length ? `<div class="kw">关键词：${d.keywords.join('、')}</div>` : ''}
        </div>`).join('');
}

async function delDoc(id) {
    if (!confirm('确认删除该知识条目？')) return;
    await fetch(`/api/knowledge/${id}`, {method: 'DELETE'});
    loadKnowledge();
}

document.getElementById('add-form').onsubmit = async function(e) {
    e.preventDefault();
    const keywords = document.getElementById('kw-keywords').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    await fetch('/api/knowledge', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            content: document.getElementById('kw-content').value,
            category: document.getElementById('kw-category').value,
            keywords: keywords.length ? keywords : null
        })
    });
    this.reset();
    loadKnowledge();
};

loadKnowledge();
</script>
</body>
</html>
